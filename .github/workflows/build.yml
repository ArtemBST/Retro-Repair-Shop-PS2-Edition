name: Build PS2 Homebrew

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools and gsKit
        run: |
          # Добавили git в список!
          apk add --no-cache make bash wget git
          
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2SDK/bin
          
          git clone https://github.com/ps2dev/gsKit.git /tmp/gsKit
          cd /tmp/gsKit && make && make install

      - name: Build project
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2SDK/bin
          
          touch font.raw
          make

      - name: Upload ELF and Font
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Game-Build
          path: |
            RetroRepairShop.elf
            font.raw
