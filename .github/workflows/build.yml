name: Build PS2 Homebrew

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          # Устанавливаем make (и другие базовые утилиты, если их нет)
          apk add --no-cache make bash

      - name: Build project
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2SDK/bin
          make

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: RetroRepairShop.elf
          path: RetroRepairShop.elf
