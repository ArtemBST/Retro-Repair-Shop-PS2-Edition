name: Build PS2 Homebrew

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools and gsKit
        run: |
          # ДОБАВИЛИ pkgconf! (в Alpine он называется именно так)
          apk add --no-cache make bash wget git cmake patch pkgconf
          
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2SDK/bin:$PS2SDK/ee/bin
          
          git clone https://github.com/ps2dev/gsKit.git /tmp/gsKit
          cd /tmp/gsKit
          mkdir build && cd build
          
          # Указываем cmake, где искать pkg-config
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$PS2SDK/ps2dev.cmake -DCMAKE_INSTALL_PREFIX=$PS2DEV/ps2sdk/ports -DPKG_CONFIG_EXECUTABLE=/usr/bin/pkg-config
          
          make
          make install

      - name: Build project
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2SDK/bin
          
          touch font.raw
          make

      - name: Upload ELF and Font
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Game-Build
          path: |
            RetroRepairShop.elf
            font.raw
